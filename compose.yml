services:
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: sqlite:///./agentguard.db
      API_CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
  web:
    build: ./apps/web
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api
